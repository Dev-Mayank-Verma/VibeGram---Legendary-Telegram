name: Build VibeGram APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o vibegram_phase1.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Add missing Android platform files
        working-directory: vibegram
        run: flutter create --platforms=android .

      - name: Install dependencies
        working-directory: vibegram
        run: flutter pub get

      - name: Build debug APK
        working-directory: vibegram
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibegram-apk
          path: vibegram/build/app/outputs/flutter-apk/app-debug.apk
