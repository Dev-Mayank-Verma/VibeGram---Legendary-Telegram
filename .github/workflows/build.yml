name: Build VibeGram APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o vibegram_phase1.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Add missing Android platform files
        working-directory: vibegram
        run: flutter create --platforms=android .

      - name: Fix compileSdk for Agora/Firebase compatibility (app module)
        run: |
          cat >> vibegram/android/app/build.gradle.kts << 'GRADLE_EOF'

          android {
              compileSdk = 36
          }
          GRADLE_EOF

      - name: Fix compileSdk for ALL modules (Agora's own plugin module included)
        run: |
          cat >> vibegram/android/build.gradle.kts << 'GRADLE_EOF'

          subprojects {
              plugins.withId("com.android.application") {
                  extensions.configure<com.android.build.gradle.BaseExtension> {
                      compileSdkVersion(36)
                  }
              }
              plugins.withId("com.android.library") {
                  extensions.configure<com.android.build.gradle.BaseExtension> {
                      compileSdkVersion(36)
                  }
              }
          }
          GRADLE_EOF
          echo "--- android/build.gradle.kts (root) after patch ---"
          cat vibegram/android/build.gradle.kts
          echo "--- android/app/build.gradle.kts after patch ---"
          cat vibegram/android/app/build.gradle.kts

      - name: Add calling permissions to AndroidManifest
        run: |
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.BLUETOOTH"/>\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT"/>\n</manifest>|' vibegram/android/app/src/main/AndroidManifest.xml

      - name: Add Firebase Google Services plugin
        run: |
          sed -i '/dev.flutter.flutter-plugin-loader/a\    id("com.google.gms.google-services") version "4.4.0" apply false' vibegram/android/settings.gradle.kts
          sed -i '/id("com.android.application")/a\    id("com.google.gms.google-services")' vibegram/android/app/build.gradle.kts

      - name: Add google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: echo "$GOOGLE_SERVICES_JSON" > vibegram/android/app/google-services.json

      - name: Install dependencies
        working-directory: vibegram
        run: flutter pub get

      - name: Set compileSdkVersion via rootProject.extra (Agora's own build.gradle reads this)
        run: |
          echo 'rootProject.extra["compileSdkVersion"] = 36' >> vibegram/android/build.gradle.kts
          echo "--- android/build.gradle.kts (final) ---"
          cat vibegram/android/build.gradle.kts

      - name: Build debug APK
        working-directory: vibegram
        run: |
          flutter build apk --debug \
            --dart-define=AGORA_APP_ID=${{ secrets.AGORA_APP_ID }} \
            --dart-define=AGORA_TOKEN_URL=${{ secrets.AGORA_TOKEN_URL }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vibegram-apk
          path: vibegram/build/app/outputs/flutter-apk/app-debug.apk
