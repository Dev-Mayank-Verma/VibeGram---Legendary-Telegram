name: Deploy Agora Token Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o vibegram_phase1.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: echo "$FIREBASE_SERVICE_ACCOUNT" > /tmp/gcp-key.json

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: vibegram/functions
        run: npm install

      - name: Set Agora secrets in Cloud Functions
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        run: |
          echo -n "${{ secrets.AGORA_APP_ID }}" | firebase functions:secrets:set AGORA_APP_ID --project="${{ secrets.FIREBASE_PROJECT_ID }}" --data-file=- --force
          echo -n "${{ secrets.AGORA_APP_CERTIFICATE }}" | firebase functions:secrets:set AGORA_APP_CERTIFICATE --project="${{ secrets.FIREBASE_PROJECT_ID }}" --data-file=- --force

      - name: Deploy Cloud Function
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/gcp-key.json
        working-directory: vibegram/functions
        run: firebase deploy --only functions --project="${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
