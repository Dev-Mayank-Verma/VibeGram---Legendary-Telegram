name: Deploy Agora Token Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o vibegram_phase1.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: vibegram/functions
        run: npm install

      - name: Set Agora secrets in Cloud Functions
        working-directory: vibegram/functions
        run: |
          printf '%s' "${{ secrets.AGORA_APP_ID }}" | firebase functions:secrets:set AGORA_APP_ID --project="${{ secrets.FIREBASE_PROJECT_ID }}" --data-file=- --force
          printf '%s' "${{ secrets.AGORA_APP_CERTIFICATE }}" | firebase functions:secrets:set AGORA_APP_CERTIFICATE --project="${{ secrets.FIREBASE_PROJECT_ID }}" --data-file=- --force

      - name: Deploy Cloud Function
        working-directory: vibegram/functions
        run: firebase deploy --only functions --project="${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
