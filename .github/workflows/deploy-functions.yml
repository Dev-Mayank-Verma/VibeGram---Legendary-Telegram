name: Deploy Agora Token Server

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unzip project
        run: unzip -o vibegram_phase1.zip

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install function dependencies
        working-directory: vibegram/functions
        run: npm install

      - name: Create .env.local with secrets
        working-directory: vibegram/functions
        run: |
          cat > .env.local << EOF
          AGORA_APP_ID=${{ secrets.AGORA_APP_ID }}
          AGORA_APP_CERTIFICATE=${{ secrets.AGORA_APP_CERTIFICATE }}
          EOF

      - name: Deploy Cloud Function
        working-directory: vibegram/functions
        run: firebase deploy --only functions --project="${{ secrets.FIREBASE_PROJECT_ID }}" --non-interactive
